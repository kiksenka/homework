<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e9dc;--card:#fffaf3;--ink:#2b1d14;--mute:#8d7a6a;--line:#e6d6c3;--acc:#7b4a2a;--ok:#1f9d55;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(#e6d6c3 1.2px,transparent 1.4px) 0 0/22px 22px;color:var(--ink);font:18px/1.35 'IBM Plex Sans',system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px}
.logo{margin:6px 0 14px;text-align:center;font:italic 800 clamp(34px,7vw,54px)/1.1 'Playfair Display',Georgia,serif;color:#5a3318;letter-spacing:.5px}
.logo span{display:inline-block;padding:0 .6em;position:relative}
.card{border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;border:0;background:#e9ecf0;border-radius:10px;height:8px;cursor:pointer;padding:0}
.tab.on{background:var(--acc)}
.screen{display:none}.screen.on{display:block}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 2px #0001}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--mute);font-weight:600}
.want{font-size:26px;font-weight:650;margin:0 0 16px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.item{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.item:hover{border-color:var(--acc)}
.item i{display:block;font-style:normal;font-size:36px;line-height:1.2}
.item b{display:block;font-weight:600;font-size:15px}
.item span{color:var(--mute);font-size:14px}
.tray{min-height:62px;border:1.5px dashed #c5cbd3;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.tray:empty::before{content:'';}
.chip{border:0;background:#f1e3d2;color:var(--acc);border-radius:20px;padding:8px 14px;font:600 16px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--acc);color:#fff;font:600 18px 'IBM Plex Sans',system-ui,sans-serif;padding:11px 26px;border-radius:12px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.price{font-size:34px;font-weight:700}
.sum{font-size:26px;font-weight:650;margin-left:auto}
.msg{font-weight:650;min-height:24px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.money{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bill{width:170px;cursor:pointer;user-select:none;border-radius:4px;box-shadow:0 1px 3px #0005;line-height:0;overflow:hidden}
.bill img{width:100%;display:block;pointer-events:none}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.b{max-width:85%;padding:10px 16px 12px;border-radius:16px;font-weight:600;font-size:22px;line-height:1.3;animation:in .25s}
.b::before{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;opacity:.7}
.b.c{background:#fff;color:#2b1d14;border:2px solid #d9c3a8;align-self:flex-start;border-bottom-left-radius:4px}
.b.c::before{content:'café';color:#7b4a2a}
.b.m{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.b.m::before{content:'me'}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.coin{background:none;border:0;display:block;line-height:0}.coin img{display:block;pointer-events:none}
.memo{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center;margin-top:14px;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 1px 2px #0001}
.memo div{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.memo small{color:var(--mute);font-weight:600;display:block;font-size:13px}
.say{border:0;background:#fff;border:1.5px solid var(--acc);color:var(--acc);font:600 18px 'IBM Plex Sans',system-ui,sans-serif;padding:11px 22px;border-radius:14px;cursor:pointer}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.scene{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.pane .e{font-size:48px;line-height:1.1}
.pane p{margin:6px 0 0;font-weight:600}
.pane small{color:var(--mute);font-weight:600}
.opts{display:grid;gap:8px;margin:14px 0 6px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;text-align:left;font:600 18px 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.ok{background:#e6f6ec;border-color:var(--ok)}.opt.bad{background:#fbeaea;border-color:var(--bad)}
.ex{color:var(--mute);font-weight:600}
</style></head><body><main>
<h1 class="logo"><span>Time for Coffee</span></h1>
<div class="tabs"><button class="tab on"></button><button class="tab"></button></div>

<section class="screen on" id="s0"><div class="card">
 <div class="chat" id="chat"></div>
 <div id="st1" hidden>
  <div class="menu" id="menu2"></div>
  <div class="tray" id="otray"></div>
  <div class="row"><button class="btn" id="obtn">✓</button><span class="msg" id="omsg"></span></div>
 </div>
 <div id="st2" hidden><button class="say" id="nobtn">No, thanks.</button></div>
 <div id="st3" hidden>
  <div class="tray" id="ptray"></div>
  <div class="money" id="wallet"></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="pbtn">✓</button><span class="msg" id="pmsg"></span><span class="sum" id="ptotal"></span></div>
 </div>
 <div id="st4" hidden>
  <div class="tray" id="ctray"></div>
  <div class="money" id="drawer"></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="cbtn">✓</button><span class="msg" id="cmsg"></span><span class="sum" id="ctotal"></span></div>
 </div>
 <div id="st5" hidden></div>
 <div id="st6" hidden><button class="say" id="hibtn">Fine, thanks. And you?</button></div>
 <div id="st8" hidden><button class="btn" id="startbtn" style="font-size:26px;padding:14px 40px">▶</button></div>
 <div id="st7" hidden><button class="say" id="byebtn">You too. Bye!</button></div>
</div>
<div class="nav" style="justify-content:flex-end"><button class="btn" id="rnext" disabled>↻</button></div>
<div class="memo" id="memo"></div>
</section>

<section class="screen" id="s1"><div class="card">
 <div class="top"><span id="qprog"></span><span class="ex" id="qex" hidden>example</span></div>
 <div class="scene">
  <div class="pane"><small>me</small><div class="e" id="qa"></div><p id="qat"></p></div>
  <div class="pane"><small>café</small><div class="e" id="qb"></div><p id="qbt"></p></div>
 </div>
 <div class="opts" id="qopts"></div>
 <div class="msg" id="qmsg"></div>
</div>
<div class="nav"><button class="btn sec" id="qprev">←</button><button class="btn" id="qnext" disabled>→</button></div>
</section>
</main>

const fmt=c=>'$'+(c/100).toFixed(2);
let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}
let spk=0;
function utter(t){const u=new SpeechSynthesisUtterance(t);u.lang=VOICE?VOICE.lang:'en-GB';if(VOICE)u.voice=VOICE;u.rate=.85;u.volume=1;(window._u=window._u||[]).push(u);if(window._u.length>20)window._u.shift();return u}
function speak(t,queue){try{
 const ss=window.speechSynthesis;if(!ss)return;pickVoice();
 if(queue){ss.resume();ss.speak(utter(t));return}
 ss.cancel();ss.resume();
 const id=++spk;
 setTimeout(()=>{if(id===spk)ss.speak(utter(t))},120)
}catch(e){}}

const BILLS=['b10000','b5000','b2000','b1000','b500','b200','b100'];
const COINS=['c100','c25','c10','c5','c1'];
const val=p=>+p.slice(1);
function pieceEl(p){const d=document.createElement('div');
 if(p[0]=='c'){d.className='coin';const k=COIN[val(p)];d.innerHTML='<img src="'+k[0]+'" width="'+Math.round(k[1]*1.5)+'" height="'+Math.round(k[1]*1.5)+'" alt="">'}
 else{d.className='bill';d.innerHTML='<img src="'+IMG[val(p)/100]+'" alt="">'}
 return d}
function moneyRow(el,onpick){el.innerHTML='';[...BILLS,...COINS].forEach(p=>{const d=pieceEl(p);d.onclick=()=>onpick(p);el.append(d)})}
function tray(el,arr,onrm){el.innerHTML='';arr.forEach((p,i)=>{const d=pieceEl(p);d.onclick=()=>onrm(i);el.append(d)})}
const sum=a=>a.reduce((x,y)=>x+val(y),0);
const sumN=a=>a.reduce((x,y)=>x+y,0);

let sel=[],pay=[],chg=[],total=0,paid=0;
const PL={americano:'americanos',espresso:'espressos',cappuccino:'cappuccinos',latte:'lattes',tea:'teas',water:'waters',juice:'orange juices',cake:'cakes',sandwich:'sandwiches'};
const NUM=['','','two','three','four','five','six','seven','eight','nine','ten'];
function orderText(){const c={};sel.forEach(id=>c[id]=(c[id]||0)+1);
 return Object.keys(c).map(id=>c[id]==1?byId[id].n:(NUM[c[id]]||c[id])+' '+PL[id]).join(' and ')+', please.'}
M.forEach(m=>$('menu2').append(mcard(m,x=>{if(sel.length<10){sel.push(x.id);drawO();speak(x.n)}})));
function show(n){[1,2,3,4,5,6,7,8].forEach(i=>$('st'+i).hidden=i!==n)}
function say(who,t){const d=document.createElement('div');d.className='b '+who;d.textContent=t;$('chat').append(d);speak(t,true);d.style.cursor='pointer';d.onclick=()=>speak(t);d.scrollIntoView({block:'nearest',behavior:'smooth'})}
function drawO(){const t=$('otray');t.innerHTML='';sel.forEach((id,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=byId[id].n+' ✕';b.onclick=()=>{sel.splice(i,1);drawO()};t.append(b)});$('omsg').textContent=''}
const ONES='zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' '),TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function nw(n){if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');const h=Math.floor(n/100),r=n%100;return ONES[h]+' hundred'+(r?' '+nw(r):'')}
function moneyWords(c){if(c==0)return 'zero dollars';const d=Math.floor(c/100),k=c%100;const ds=d?nw(d)+(d==1?' dollar':' dollars'):'',ks=k?nw(k)+(k==1?' cent':' cents'):'';return ds&&ks?ds+' and '+ks:ds||ks}
function drawP(){tray($('ptray'),pay,i=>{pay.splice(i,1);drawP();speak(moneyWords(sum(pay)))});$('ptotal').textContent=fmt(sum(pay));$('pmsg').textContent=''}
function drawC(){tray($('ctray'),chg,i=>{chg.splice(i,1);drawC();speak(moneyWords(sum(chg)))});$('ctotal').textContent=fmt(sum(chg));$('cmsg').textContent=''}
function setR(){sel=[];pay=[];chg=[];$('chat').innerHTML='';
 drawO();drawP();drawC();$('rnext').disabled=true;
 say('c','Hi! How are you?');show(6)}
$('hibtn').onclick=()=>{say('m','Fine, thanks. And you?');show(0);setTimeout(()=>{say('c','Good, thanks! What would you like?');show(1)},500)};
$('byebtn').onclick=()=>{say('m','You too. Bye!');show(5);$('rnext').disabled=false};
$('obtn').onclick=()=>{if(!sel.length){$('omsg').className='msg bad';$('omsg').textContent='✗';return}
 total=sumN(sel.map(id=>byId[id].p));
 say('m','I want '+orderText());setTimeout(()=>say('c','Anything else?'),500);show(2)};
$('nobtn').onclick=()=>{say('m','No, thanks.');show(0);setTimeout(()=>{say('c',"That's "+fmt(total)+', please.');show(3)},500)};
$('pbtn').onclick=()=>{paid=sum(pay);
 if(paid<total){$('pmsg').className='msg bad';$('pmsg').textContent='✗';return}
 say('m','Here you are.');show(0);
 if(paid==total){setTimeout(()=>{say('c','Thank you. Have a nice day!');show(7)},500);return}
 setTimeout(()=>{say('c','Your change.');show(4)},500)};
$('cbtn').onclick=()=>{if(sum(chg)!=paid-total){$('cmsg').className='msg bad';$('cmsg').textContent='✗';return}
 say('m','Thank you.');show(0);setTimeout(()=>{say('c','Have a nice day!');show(7)},500)};

let qi=0,qdone=new Set();
function setQ(i){qi=i;const q=Q[i];$('qprog').textContent=(i+1)+' / '+Q.length;
 $('qex').hidden=!q.ex;$('qa').textContent=q.a[0];$('qat').textContent=q.a[1];
 $('qb').textContent=q.b[0];$('qbt').textContent=q.b[1];
 const o=$('qopts');o.innerHTML='';$('qmsg').textContent='';
 q.o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;
  b.onclick=()=>{if(k==q.c){b.classList.add('ok');qdone.add(i);$('qmsg').className='msg ok';$('qmsg').textContent='✓';$('qnext').disabled=false;speak(t)}else{b.classList.add('bad');$('qmsg').className='msg bad';$('qmsg').textContent='✗'}};
  o.append(b);
  if(q.ex&&k==q.c){b.classList.add('ok')}});
 $('qnext').disabled=!(qdone.has(i)||q.ex);
 $('qprev').disabled=i==0}
$('qprev').onclick=()=>qi>0&&setQ(qi-1);
$('qnext').onclick=()=>qi<Q.length-1&&setQ(qi+1);
setQ(0);
