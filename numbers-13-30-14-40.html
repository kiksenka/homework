<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>13 · 30 · 14 · 40</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --card:#fff; --ink:#14213D; --soft:#14213D1f; --mid:#14213D88;
  --teal:#2A9D8F; --tealbg:#DDF1EE; --coral:#F4743B; --coralbg:#FDE6DA; --bad:#D1495B; --badbg:#FBE3E6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
#wrap{max-width:480px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
svg{display:block}

.steps{display:flex;gap:6px;margin:2px 0 18px}
.step{flex:1;height:44px;border-radius:14px;background:var(--card);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--mid);box-shadow:0 1px 0 var(--soft)}
.step.done{background:var(--tealbg);color:var(--teal)}
.step.on{background:var(--ink);color:#fff}

.card{background:var(--card);border-radius:24px;padding:22px 18px 24px;box-shadow:0 1px 0 var(--soft)}

/* memo */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{border-radius:24px;padding:22px 8px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile.teen{background:var(--tealbg)}
.tile.ty{background:var(--coralbg)}
.tile .big{font-size:76px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tile .word{font-size:20px;font-weight:500;height:28px}
.tile .word b{font-weight:700}
.tile.teen .word b{color:var(--teal)}
.tile.ty .word b{color:#D2551F}
.ico{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.teen .ico{background:var(--teal)}.ty .ico{background:var(--coral)}
.ico svg{width:26px;height:26px}
.ico .bars{display:none}
.go .ico .bars{display:flex}.go .ico .tri{display:none}
.bars{gap:4px;align-items:flex-end;height:24px}
.bars i{width:5px;background:#fff;border-radius:3px;animation:b .7s ease-in-out infinite alternate}
.bars i:nth-child(1){height:12px}.bars i:nth-child(2){height:24px;animation-delay:.15s}.bars i:nth-child(3){height:17px;animation-delay:.3s}
@keyframes b{to{transform:scaleY(.4)}}
@media (prefers-reduced-motion:reduce){.bars i{animation:none}}

/* round buttons */
.round{width:68px;height:68px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:transform .08s}
.round:active{transform:scale(.94)}
.round svg{width:32px;height:32px}
.round[disabled]{opacity:.18;cursor:default}
.round.teal{background:var(--teal)}
.round.wide{width:100%;border-radius:20px;height:64px}
.round.wide.next{background:var(--ink)}

/* trainer */
.dots{display:flex;gap:5px;margin:0 0 20px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--soft)}
.dots i.cur{background:var(--ink)}
.dots i.ok{background:var(--teal)}
.dots i.no{background:var(--bad)}
.playwrap{position:relative;width:132px;margin:4px auto 22px}
.play{width:132px;height:132px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #C75B28;transition:.1s}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #C75B28}
.play[disabled]{background:#cfd6dc;box-shadow:none;cursor:default}
.play svg{width:56px;height:56px;margin-left:6px}
.play .bars{display:none;height:48px}.play .bars i{width:9px}
.play .bars i:nth-child(1){height:24px}.play .bars i:nth-child(2){height:48px}.play .bars i:nth-child(3){height:34px}
.play.go .bars{display:flex}.play.go .tri{display:none}
.once{position:absolute;right:-14px;top:-6px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;border-radius:99px;padding:5px 11px}
.inputs{display:flex;gap:10px;justify-content:center;margin:0 0 20px}
.slot{flex:1;max-width:120px;text-align:center}
.slot input{width:100%;height:84px;font:inherit;font-size:44px;font-weight:700;text-align:center;color:var(--ink);background:var(--bg);border:3px solid transparent;border-radius:18px;padding:0;-webkit-appearance:none;appearance:none}
.slot input:focus{border-color:var(--ink);background:#fff;outline:none}
.slot.good input{border-color:var(--teal);background:var(--tealbg)}
.slot.bad input{border-color:var(--bad);background:var(--badbg)}
.slot .ans{font-size:26px;font-weight:700;margin-top:6px;height:34px;color:var(--bad)}
.slot.good .ans{color:var(--teal)}

.score{text-align:center;margin:6px 0 16px;line-height:1}
.score .n{font-size:96px;font-weight:700}
.score .of{font-size:30px;font-weight:500;color:var(--mid)}
.setrow{display:flex;align-items:center;gap:12px;margin:12px 0;font-weight:700;font-size:20px}
.setrow .lbl{width:22px}
.setrow .bar{flex:1;height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.setrow .bar i{display:block;height:100%;background:var(--teal);border-radius:7px}
.setrow .v{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-size:18px}
.reset{margin-top:22px;display:flex;justify-content:center}
.reset button{width:48px;height:48px;border-radius:50%;color:var(--mid);display:flex;align-items:center;justify-content:center}
.reset button.armed{background:var(--bad);color:#fff}
.reset svg{width:24px;height:24px}
</style>
</head>

  <div class="steps" id="steps"></div>
  <div id="app"></div>
</div>

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.sets) && s.sets.length===SETS.length) return s; }catch(e){}
  return fresh();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- audio: plain mp3 files (embedded), played one after another ---------- */
const audio = new Audio();
const SRC = {};
Object.keys(AUDIO_B64).forEach(k => SRC[k] = 'data:audio/mpeg;base64,' + AUDIO_B64[k]);
let ready = true, failed = false, playingBtn = null, token = 0;
function stopAll(){
  token++;
  try{ audio.pause(); }catch(e){}
  if(playingBtn){ playingBtn.classList.remove('go'); playingBtn = null; }
}
function playSeq(seq, btn, onStart, onDone){
  if(btn && btn.disabled) return;
  stopAll();
  const my = token; let k = 0;
  playingBtn = btn || null;
  if(btn) btn.classList.add('go');
  const finish = ok => {
    if(my !== token) return;
    if(btn) btn.classList.remove('go');
    playingBtn = null;
    if(onDone) onDone(ok);
  };
  const next = () => {
    if(my !== token) return;
    if(k >= seq.length) return finish(true);
    audio.src = SRC[seq[k++]];
    const p = audio.play();
    if(p && p.catch) p.catch(() => finish(false));
  };
  audio.onended = () => { if(my === token) setTimeout(next, 500); };
  audio.onerror = () => finish(false);
  next();
  if(onStart) onStart();
}

function go(view){ S.view = view; fb = null; resetArmed = false; save(); render(); window.scrollTo(0,0); }

function renderSteps(){
  const views = ['memo','s0','s1','s2','s3','s4','result'];
  $('#steps').innerHTML = views.map((v,i)=>{
    const done = i>=1 && i<=SETS.length && setDone(i-1);
    const lab = i===0 ? BOOK : i===6 ? STAR : i;
    const name = i===0?'Memo':i===6?'Score':'Set '+i;
    return `<button class="step${S.view===v?' on':''}${done?' done':''}" data-go="${v}" aria-label="${name}">${lab}</button>`;
  }).join('');
}

function viewItem(i){
  const s = SETS[i], st = S.sets[i];
  const showingFb = fb && fb.set===i;
  const idx = showingFb ? fb.item : st.res.length;
  const item = s.items[idx];

  const dots = Array.from({length:PER_SET},(_,k)=>{
    const r = st.res[k];
    return `<i class="${r?(r.ok?'ok':'no'):(k===idx?'cur':'')}"></i>`;
  }).join('');
  const locked = !s.replay && st.played && !showingFb;
  const slots = item.map((n,k)=>{
    const state = res ? (res.ans[k]===String(n)?'good':'bad') : '';
    const ansTxt = res ? (state==='good' ? '✓' : String(n)) : '';
    return `<div class="slot ${state}">
      <input inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" autocorrect="off" aria-label="Number ${k+1}"
        data-slot="${k}" value="${res?res.ans[k]:''}" ${res?'disabled':''}>
      <div class="ans">${ansTxt}</div></div>`;
  }).join('');
  const last = idx===PER_SET-1;
  const once = !s.replay && !res;
  return `
  <div class="card">
    <div class="dots">${dots}</div>
    <div class="playwrap">
      <button class="play" ${(!ready||locked)?'disabled':''} aria-label="Play" data-main="${i}">${TRI}${BARS}</button>
      ${once?'<span class="once">1×</span>':''}
    </div>
    <div class="inputs">${slots}</div>
    ${res
      ? `<button class="round wide next" data-next="${i}" aria-label="Next">${ARROW}</button>`
      : `<button class="round wide teal" id="checkBtn" data-check="${i}" disabled aria-label="Check">${CHECK}</button>`}
  </div>
  <script type="application/json" id="cur">${JSON.stringify({set:i,idx})}<\/script>`;
}

function viewSetDone(i){
  const sc = setScore(i), lastSet = i===SETS.length-1;
  const dots = S.sets[i].res.map(r=>`<i class="${r.ok?'ok':'no'}"></i>`).join('');
  return `<div class="card">
    <div class="score"><span class="n">${sc}</span> <span class="of">/ ${PER_SET}</span></div>
    <div class="dots" style="margin:0 0 26px">${dots}</div>
    <button class="round wide next" data-go="${lastSet?'result':'s'+(i+1)}" aria-label="Next">${ARROW}</button>
  </div>`;
}

function viewResult(){
  const rows = SETS.map((s,i)=>{
    const n = S.sets[i].res.length, sc = setScore(i);
    return `<div class="setrow"><span class="lbl">${s.n}</span>
      <span class="bar"><i style="width:${sc/PER_SET*100}%"></i></span>
      <span class="v">${n?sc+'/'+PER_SET:'–'}</span></div>`;
  }).join('');
  return `<div class="card">
    <div class="score"><span class="n">${total()}</span> <span class="of">/ ${MAX}</span></div>
    ${rows}
    <div class="reset"><button data-reset class="${resetArmed?'armed':''}" aria-label="Start again">${resetArmed?CHECK:REDO}</button></div>
  </div>`;
}

function render(){
  renderSteps();
  const v = S.view; let h;
  if(v==='memo') h = viewMemo();
  else if(v==='result') h = viewResult();
  else { const i = +v.slice(1); h = (fb && fb.set===i) ? viewItem(i) : setDone(i) ? viewSetDone(i) : viewItem(i); }
  $('#app').innerHTML = h;
}

/* ---------- events ---------- */
function slots(){ return [...document.querySelectorAll('.slot input')]; }
function updateCheck(){ const b = $('#checkBtn'); if(b) b.disabled = !slots().every(x=>x.value.length>0); }
function curInfo(){ const el=$('#cur'); return el?JSON.parse(el.textContent):null; }
function doCheck(i){
  const info = curInfo(); if(!info) return;
  const item = SETS[i].items[info.idx];
  const ans = slots().map(x=>x.value.trim());
  const ok = item.every((n,k)=>ans[k]===String(n));
  S.sets[i].res.push({ans, ok});
  S.sets[i].played = false;
  fb = {set:i, item:info.idx};
  save(); render();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-go],[data-main],[data-play],[data-check],[data-next],[data-reset]');
  if(!t) return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.play){ t.classList.add('go'); return playSeq([+t.dataset.play], t); }
  if(t.dataset.main!==undefined){
    const i = +t.dataset.main, info = curInfo(), s = SETS[i], st = S.sets[i];
    const lockIt = !(fb && fb.set===i) && !s.replay;
    playSeq(s.items[info.idx], t, ()=>{
      if(lockIt){ st.played = true; save(); }
      const f = slots()[0]; if(f && !f.disabled) setTimeout(()=>f.focus({preventScroll:true}),50);
    }, ok=>{
      if(lockIt && ok){ t.disabled = true; const o=document.querySelector('.once'); if(o) o.remove(); }
    });
    return;
  }
  if(t.dataset.check!==undefined) return doCheck(+t.dataset.check);
  if(t.dataset.next!==undefined){ fb=null; render(); window.scrollTo(0,0); return; }
  if('reset' in t.dataset){
    if(!resetArmed){ resetArmed=true; render(); return; }
    S = fresh(); fb=null; resetArmed=false; save(); render(); window.scrollTo(0,0);
  }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if(!el.matches || !el.matches('.slot input')) return;
  el.value = el.value.replace(/\D/g,'').slice(0,2);
  if(el.value.length===2){ const all=slots(), k=all.indexOf(el); if(all[k+1]) all[k+1].focus(); }
  updateCheck();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const c = $('#checkBtn'), n = document.querySelector('[data-next]');
  if(c && !c.disabled) c.click(); else if(n) n.click();
});
render();
</script>
</body>
</html>
