<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1.3 Grammar</title>
<style>
:root{--or:#E8802A;--ink:#1c1c1c;--blue:#1F64B5;--red:#E93C35;--line:#bdbdbd;--chip:#fbe4c6;--box:#f3f3f3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.4;padding-bottom:80px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
.hd{background:linear-gradient(90deg,#cfcfcf,#f1f1f1);padding:8px 16px;display:flex;align-items:baseline;gap:12px;color:var(--or);font-weight:700}
.hd b{font-size:40px;line-height:1}
.hd span{font-size:26px}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 0}
.ti{display:flex;gap:10px;font-weight:700;margin-bottom:12px}
.ti i{font-style:normal;color:var(--or);flex:none}
.pic{display:block;width:100%;max-width:460px;margin:0 auto 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{background:var(--chip);border-radius:6px;padding:8px 13px;min-height:42px}
.chip.sel{background:var(--ink);color:#fff}
.chip.in{background:transparent;color:var(--blue);font-style:italic;padding:6px 8px 6px 4px}
.wb{border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.fill{display:flex;gap:8px;align-items:baseline;border-bottom:2px solid var(--ink);min-height:54px;padding:4px 0;margin:6px 0;flex-wrap:wrap;width:100%;text-align:left}
.fill.ready{background:var(--box)}
.fill>b{font-weight:500}
.ex{color:var(--blue);font-style:italic}
.it{display:flex;gap:10px;padding:8px 0}
.n{flex:none;width:22px}
.g{flex:1;min-width:0}
.line{min-height:46px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:3px 0}
.line .chip{padding:6px 11px;min-height:38px}
.tw{display:flex;gap:8px;margin-top:8px}
.tw button{border:2px solid var(--ink);border-radius:8px;padding:8px 14px;min-height:42px}
.tw button.on{background:var(--ink);color:#fff}
.wrong{color:var(--red)!important}
.wrong.line,.wrong.fill{border-color:var(--red)}
.tw button.wrong{border-color:var(--red)}
.tw button.on.wrong{background:var(--red);color:#fff!important}
.chip.wrong{background:#fde2e0}
.right{color:var(--blue)!important}
.slot{flex:1;min-width:150px;min-height:44px;border-bottom:2px solid var(--ink);padding:6px 0;margin:0;text-align:left}
.m{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 10px;width:100%;text-align:left;padding:5px 0}
.m.sel .slot{background:var(--box)}
.m span.t{display:block;padding:6px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.o{background:var(--chip);border-radius:6px;padding:8px 13px;min-height:42px}
.o:disabled{opacity:.25}
.s{font-size:18px;line-height:2.1}
.pk{display:inline;white-space:nowrap}
.pk button{background:var(--chip);border:2px solid transparent;border-radius:999px;padding:5px 12px;min-height:40px;margin:2px 3px}
.pk button.on{background:#fff;border-color:var(--ink);font-weight:700}
.pk.wrong button.on{border-color:var(--red)}
.pk.right button.on{border-color:var(--blue)}
.pn{background:#d3e0ec;border-radius:18px;padding:12px 14px 16px;margin-bottom:6px}
.pn .pic{border-radius:10px;max-width:420px}
.st{font-size:19px;line-height:2.3;margin:0}
sup{font-size:.65em;margin-right:2px}
.gap{border-bottom:2px solid var(--ink);background:rgba(255,255,255,.7);min-width:110px;min-height:40px;padding:2px 8px;display:inline-block;vertical-align:middle;margin:0 4px;color:var(--blue);font-style:italic;text-align:center}
.gap.e{color:transparent}
.gap.wrong{border-color:var(--red)}
.gap.right{border-color:var(--blue)}
.gap.x{border:0;background:none;min-width:0;padding:0}
.shbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet .o{display:block;width:100%;margin:8px 0;font-size:20px;text-align:left;padding:12px 14px;border-radius:8px}
.q{font-weight:700}
.ans{display:block;width:100%;text-align:left;background:var(--chip);border-radius:8px;padding:10px 14px;margin:8px 0 0;min-height:46px}
.ans.on{background:var(--ink);color:#fff}
.ans.wrong{background:#fde2e0}
.ans.right{background:#dbe8f6}
.ft{margin-top:14px;display:flex;align-items:center;gap:14px}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:12px 28px;min-height:46px;font-weight:700}
.btn:disabled{opacity:.25}
.sc{color:var(--blue);font-weight:700;font-size:22px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
nav .in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
nav .btn{padding:10px 22px}
.dots{display:flex;gap:8px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink)}
.dot.done{background:var(--ink)}
.dot.nudge{animation:nd .4s 3}@keyframes nd{50%{transform:scale(1.7);background:var(--or);border-color:var(--or)}}
.dot.cur{box-shadow:0 0 0 3px var(--or)}
.res{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid #ddd;font-size:22px}
.res b{color:var(--or)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0;font-size:30px;font-weight:700}
.tot span:last-child{color:var(--blue)}
</style>
</head>
<body>
<div class="hd"><b>1.3</b><span>Grammar</span></div>
<div class="wrap"><main id="main"></main></div>
<nav><div class="in">
  <button class="btn" id="back">←</button>
  <div class="dots" id="dots"></div>
  <button class="btn" id="next">→</button>
</div></nav>

function h(tag,a={},...kids){
  const e=document.createElement(tag);
  for(const k in a){const v=a[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});
  return e;
}

    const pool=this.W.filter(x=>!st.pl[x[0]]);
    const row=(g,label,pre)=>h('button',{class:'fill'+(st.sel&&L?' ready':''),onclick:L&&(()=>{if(st.sel){st.pl[st.sel]=g;st.sel=null;refresh()}})},
      h('b',{},label),pre,
      this.W.filter(x=>st.pl[x[0]]===g).map(x=>h('span',{class:'chip in'+(this.done?(st.pl[x[0]]===x[1]?' right':' wrong'):''),onclick:L&&(e=>{e.stopPropagation();delete st.pl[x[0]];refresh()})},x[0]+(this.done?(st.pl[x[0]]===x[1]?' ✓':' ✗'):''))));
    return [pool.length?h('div',{class:'wb chips'},pool.map(x=>chip(x[0],st.sel===x[0]?'sel':'',L&&(()=>{st.sel=st.sel===x[0]?null:x[0];refresh()})))):null,
      row('N','Now:',h('span',{class:'ex'},'right now,')),
      row('R','Regularly:')];
  },
  ready(){return this.W.every(x=>this.st.pl[x[0]])},
  score(){return this.W.filter(x=>this.st.pl[x[0]]===x[1]).length}
};

const ex2={
  title:'Put the words in the correct order to make sentences. Then choose Regularly or Now.',max:5,
  I:[
    {w:["right","dancing","now","she's"],ok:["she's dancing right now"],rn:'N',ex:true},
    {w:["at home","working","I'm"],ok:["i'm working at home","at home i'm working"],rn:'N'},
    {w:["drinks","often","tea","Dad"],ok:["dad often drinks tea","dad drinks tea often","often dad drinks tea"],rn:'R'},
    {w:["at the weekend","they","chess","play"],ok:["they play chess at the weekend","at the weekend they play chess"],rn:'R'},
    {w:["doing","English","we're","homework","now","our"],ok:["we're doing our english homework now","now we're doing our english homework"],rn:'N'},
    {w:["gets up","he","early","every day"],ok:["he gets up early every day","every day he gets up early"],rn:'R'}
  ],
  st:null,
  init(){this.st=this.I.map(it=>it.ex?{seq:[3,1,0,2],rn:'N'}:{seq:[],rn:null})},
  res(i){const s=this.st[i],it=this.I[i];
    return{s:it.ok.includes(norm(s.seq.map(k=>it.w[k]).join(' '))),r:s.rn===it.rn}},
  build(){
    if(!this.st)this.init();const D=this.done;
    return this.I.map((it,i)=>{
      const s=this.st[i],lock=FIN||it.ex,r=D&&!it.ex?this.res(i):null;
      const free=it.w.map((w,k)=>k).filter(k=>!s.seq.includes(k));
      return h('div',{class:'it'},h('div',{class:'n'},i+1),h('div',{class:'g'},
        free.length&&!lock?h('div',{class:'chips',style:'margin-top:0'},free.map(k=>h('button',{class:'chip',onclick:()=>{s.seq.push(k);refresh()}},it.w[k]))):null,
        h('div',{class:'line'+(r&&!r.s?' wrong':'')},
          s.seq.map((k,p)=>h('button',{class:'chip'+(it.ex?' in':'')+(r?(r.s?' in right':' wrong'):''),onclick:!lock&&(()=>{s.seq.splice(p,1);refresh()})},p===0?cap(it.w[k]):it.w[k])),
          s.seq.length?'.':null),
        h('div',{class:'tw'},[['R','Regularly'],['N','Now']].map(([v,l])=>h('button',{class:(s.rn===v?'on ':'')+(r&&s.rn===v&&!r.r?'wrong':''),onclick:!lock&&(()=>{s.rn=v;refresh()})},l)))));
    });
  },
  ready(){if(!this.st)this.init();return this.I.every((it,i)=>it.ex||(this.st[i].seq.length===it.w.length&&this.st[i].rn))},
  score(){if(!this.st)this.init();return this.I.filter((it,i)=>{if(it.ex)return false;const r=this.res(i);return r.s&&r.r}).length}
};

const ex3={
  title:'Match the sentence halves.',max:5,
  L:['What are','Mum never','My teacher is','We always','Are they',"I'm not going"],
  R:['gets up late.','playing basketball?','meet on Fridays.','telling us a story.','to school.','you doing?'],
  key:[5,0,3,2,1,4],
  st:{a:[5,null,null,null,null,null],sel:1},
  build(){
    const st=this.st,lock=FIN,used=st.a.filter(x=>x!==null);
    const rows=this.L.map((t,i)=>{const v=st.a[i],ex=i===0;
      const r=this.done&&!ex?(v===this.key[i]?'right':'wrong'):'';
      return h('button',{class:'m'+(st.sel===i&&!lock&&!ex?' sel':''),onclick:(!lock&&!ex)?(()=>{st.sel=i;st.a[i]=null;refresh()}):null},
        h('span',{class:'t'},(i+1)+'  '+t),
        h('span',{class:'slot '+(ex?'ex':r)+(r==='wrong'?' wrong':'')},v!==null?this.R[v]:''));});
    const opts=lock?null:h('div',{class:'opts'},this.R.map((t,k)=>h('button',{class:'o',disabled:used.includes(k),onclick:()=>{
      if(st.sel===null)return;st.a[st.sel]=k;
      const nx=st.a.findIndex((x,j)=>x===null&&j>0);st.sel=nx<0?null:nx;refresh();}},t)));
    return [rows,opts];
  },
  ready(){return this.st.a.every(x=>x!==null)},
  score(){return this.key.filter((k,i)=>i>0&&this.st.a[i]===k).length}
};

const ex4={
  title:'Circle the correct answer.',max:5,
  I:[
    ['Doctor Q ',['works','is working'],' in his lab all day, every day.',0,true],
    ['He usually ',['is starting','starts'],' at eight o’clock in the morning.',1],
    ['But today Doctor Q ',['spends','is spending'],' his time outside the garage.',1],
    ['Right now Pi and Doctor Q ',['skateboard','are skateboarding'],'!',1],
    ['Millie is surprised because Doctor Q never ',['skateboards','is skateboarding'],'.',0],
    ['Doctor Q isn’t all right. He ',['goes','is going'],' to bed now.',1]
  ],
  st:{a:[0,null,null,null,null,null]},
  build(){
    const st=this.st,lock=FIN;
    return [h('img',{class:'pic',src:DOC,alt:''}),
      this.I.map((it,i)=>{const r=this.done&&!it[4]?(st.a[i]===it[3]?'right':'wrong'):'';
        return h('div',{class:'it'},h('div',{class:'n'},i+1),h('div',{class:'g s'},it[0],
          h('span',{class:'pk '+r},it[1].map((o,k)=>h('button',{class:st.a[i]===k?'on':'',onclick:(!lock&&!it[4])?(()=>{st.a[i]=k;refresh()}):null},o))),it[2]))})];
  },
  ready(){return this.st.a.every(x=>x!==null)},
  score(){return this.I.filter((it,i)=>!it[4]&&this.st.a[i]===it[3]).length}
};

const ex5={
  title:'Complete the text with the Present Simple and the Present Continuous.',max:6,
  G:{
    1:['go',['goes'],0],
    2:['hang out',['hang out','is hanging out','hangs out'],2],
    3:['ride',['rides','ride','are riding'],1],
    4:['not ride',['doesn’t ride','isn’t riding','don’t ride'],1],
    5:['skateboard',['skateboards','is skateboarding','are skateboarding'],1],
    6:['you / have',['Do you have','Are you have','Are you having'],2],
    7:['learn',['’m learn','learn','’m learning'],2]
  },
  T:['This is George. He often ',1,' to the park. He usually ',2,' with his friends, Peter and Jess. They usually ',3,' their bikes. But today George ',4,' his bike. He ',5,' with Peter and Jess at a skatepark. Let’s talk to him. ‘Hi, George! ',6,' fun?’ ‘Yes! I',7,' some new jumps. It isn’t easy!’'],
  st:{a:{1:0},open:null},
  build(){
    const st=this.st,lock=FIN;
    const para=h('p',{class:'st'},this.T.map(p=>{
      if(typeof p==='string')return p;
      const g=this.G[p],v=st.a[p],ex=p===1;
      const r=this.done&&!ex?(v===g[2]?'right':'wrong'):'';
      return [h('sup',{},p),
        h('button',{class:'gap '+(ex?'x ':'')+(v===undefined?'e ':'')+r,onclick:(!lock&&!ex)?(()=>{st.open=p;refresh()}):null},v===undefined?'…':g[1][v]),
        '('+g[0]+') '];
    }));
    const out=[h('div',{class:'pn'},h('img',{class:'pic',src:FRED,alt:''}),para)];
    if(st.open){const g=this.G[st.open];
      out.push(h('div',{class:'shbg',onclick:()=>{st.open=null;refresh()}},
        h('div',{class:'sheet',onclick:e=>e.stopPropagation()},
          g[1].map((o,k)=>h('button',{class:'o',onclick:()=>{st.a[st.open]=k;st.open=null;refresh()}},o)))));}
    return out;
  },
  ready(){return [2,3,4,5,6,7].every(i=>this.st.a[i]!==undefined)},
  score(){return [2,3,4,5,6,7].filter(i=>this.st.a[i]===this.G[i][2]).length}
};

const ex6={
  title:'Answer the questions for George.',max:4,
  Q:[
    {q:'Where do you usually hang out with your friends?',ex:'I usually hang out at the park.'},
    {q:'What do you do there?',o:['We’re riding our bikes now.','We usually rides our bikes.','We usually ride our bikes.'],k:2},
    {q:'Where are you meeting Peter and Jess today?',o:['I usually meet them at the park.','I’m meeting them at a skatepark.','I’m meeting them at school.'],k:1},
    {q:'What are you doing now?',o:['I’m learning some new jumps.','I usually go to the park.','I learn some new jumps.'],k:0},
    {q:'Are you having fun?',o:['Yes, I do.','No, I’m not.','Yes, I am.'],k:2}
  ],
  st:{a:{}},
  build(){
    const st=this.st,lock=FIN;
    return this.Q.map((it,i)=>h('div',{class:'it'},h('div',{class:'n'},i+1),h('div',{class:'g'},
      h('div',{class:'q'},it.q),
      it.ex?h('div',{class:'ex'},it.ex):
      it.o.map((t,k)=>h('button',{class:'ans'+(st.a[i]===k?(this.done?(k===it.k?' right':' wrong'):' on'):''),onclick:!lock&&(()=>{st.a[i]=k;refresh()})},t)))));
  },
  ready(){return [1,2,3,4].every(i=>this.st.a[i]!==undefined)},
  score(){return this.Q.filter((it,i)=>it.o&&this.st.a[i]===it.k).length}
};

/* ---------- app ---------- */
const E=[ex1,ex2,ex3,ex4,ex5,ex6];
E.forEach((e,i)=>{e.done=false;e.num=i+1;e.pts=0});
const KEY='grammar-1.3-v2';
let FIN=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify({cur,FIN,E:E.map(e=>({st:e.st,done:e.done,pts:e.pts}))}))}catch(_){}}
function load(){try{
  if(/reset/.test(location.search)){localStorage.removeItem(KEY);return}
  const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;
  d.E.forEach((o,i)=>{if(o.st)E[i].st=o.st;E[i].done=false;if(E[i].st&&'open' in E[i].st)E[i].st.open=null});
  cur=Math.min(d.cur||0,E.length);FIN=!!d.FIN;
}catch(_){}}
const LAST=E.length; // score page index
let cur=0;
const main=document.getElementById('main');

function draw(){
  if(cur===LAST){
    let tot=0,mx=0;
    main.replaceChildren(
      h('div',{class:'ti'},h('i',{},'★'),h('span',{},'Score')),
      ...E.map(e=>{const p=e.score();mx+=e.max;tot+=p;
        return h('div',{class:'res'},h('b',{},e.num),h('span',{},p+' / '+e.max))}),
      h('div',{class:'tot'},h('span',{},'Total'),h('span',{},tot+' / '+mx)));
  }else{
    const ex=E[cur];
    main.replaceChildren(
      h('div',{class:'ti'},h('i',{},ex.num),h('span',{},ex.title)),
      ...[ex.build()].flat(9)
    );
  }
  document.getElementById('back').disabled=cur===0;
  document.getElementById('next').disabled=cur===LAST;
  document.getElementById('dots').replaceChildren(...[...E,{}].map((e,i)=>h('button',{class:'dot'+((e.ready&&e.ready())?' done':'')+(i===LAST&&cur===LAST?' done':'')+(i===cur?' cur':'')+(i===nudge?' nudge':''),'aria-label':i===LAST?'Score':'Exercise '+(i+1),onclick:()=>go(i)})));
}
function refresh(){const y=window.scrollY;draw();save();window.scrollTo(0,y)}
let nudge=-1;
function go(i){
  i=Math.max(0,Math.min(LAST,i));
  if(i===LAST){const k=E.findIndex(e=>!e.ready());if(k>=0){i=k;nudge=k;setTimeout(()=>{nudge=-1;draw()},1600)}}
  if(i===LAST)FIN=true;
  cur=i;draw();save();window.scrollTo(0,0)}
document.getElementById('back').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
load();draw();
</script>
