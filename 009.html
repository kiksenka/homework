*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Plex",Arial,sans-serif;background:#EEF6F5;color:#263238}
.top{position:sticky;top:0;z-index:5;background:#1BA89B;color:#fff;padding:12px 16px 10px}
.top .row{display:flex;justify-content:space-between;align-items:baseline;max-width:720px;margin:0 auto}
.top b{font-size:20px}.top span{font-size:14px;opacity:.9}
.bar{max-width:720px;margin:8px auto 0;height:6px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#FFC857;border-radius:4px;transition:width .3s}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 96px}
.card{background:#fff;border-radius:18px;padding:16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:800;margin:2px 0 12px;line-height:1.25}
.q .n{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:#F26B21;color:#fff;display:grid;place-items:center;font-size:17px}
.note{background:#FFF1E3;border-radius:12px;padding:8px 12px;margin:0 0 10px;font-size:16px}
.item{position:relative;padding:12px 0 12px 34px;border-top:1px solid #EAF1F0;font-size:17px;line-height:1.4}
.item:first-of-type{border-top:0}
.num{position:absolute;left:0;top:13px;width:24px;height:24px;border-radius:50%;background:#E7F3F1;color:#1BA89B;font-weight:800;font-size:13px;display:grid;place-items:center}
.ex .num{background:#F26B21;color:#fff;font-size:0}.ex .num:after{content:"★";font-size:12px}
.opts{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.o{border:2px solid #CDE9EE;background:#fff;color:#263238;border-radius:22px;padding:6px 16px;font-size:16px;font-family:inherit;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.o.sel{background:#1597B2;border-color:#1597B2;color:#fff}
.o:disabled{cursor:default}.ex .o:not(.sel){opacity:.45}.ex .o.sel{background:#F26B21;border-color:#F26B21}
.gap{display:inline-block;min-width:64px;padding:0 10px;border-radius:10px;background:#fff;color:#1597B2;font-weight:800;text-align:center}
.gap.f{background:#DFF1F5}
.miss{animation:pulse 1.2s 2}.miss .num{background:#F26B21;color:#fff}
@keyframes pulse{50%{background:#FFF1E3}}
.chat{display:flex;gap:8px;align-items:flex-start}
.face{flex-shrink:0;width:60px}.face img{width:60px;height:62px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid #E0E7EA;background:#fff;display:block}
.bub{position:relative;flex:1;background:#E6F4F2;border-radius:16px;padding:8px 12px 10px;margin-top:2px}
.bub:before{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-right-color:#E6F4F2;border-left:0}
.nm{display:block;font-size:14px;color:#1597B2}
.item:has(.chat) .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-left:68px}
.item:has(.chat) .o{padding:5px 8px;font-size:15px}
.pics{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}.pics img{width:100%;border-radius:12px;display:block}
.pic{display:inline-block;background:#7B68B5;color:#fff;border-radius:10px;padding:0 8px;font-size:13px;font-weight:800;margin-right:4px;vertical-align:1px}
.tf .o{min-width:84px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.06);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:24px;padding:13px 10px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer}
.btn.go{background:#F26B21;color:#fff}.btn.sec{background:#E7F3F1;color:#1B7F75;flex:0 0 34%}
.res{width:100%;border-collapse:collapse;margin-top:4px}.res td{padding:12px 4px;font-size:17px;border-bottom:1px solid #EAF1F0}.res td:last-child{text-align:right;font-weight:800}
.total{margin:18px auto 6px;width:140px;height:140px;border-radius:50%;background:#F26B21;color:#fff;display:grid;place-items:center;text-align:center;font-size:34px;font-weight:800;line-height:1.1}
.total small{display:block;font-size:14px;font-weight:600}
.shot{text-align:center;color:#55707a;margin:8px 0 0}
.line{background:#E6F4F2;border-radius:14px;padding:9px 12px}
.item:has(.line) .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item:has(.line) .o{padding:6px 8px;font-size:15px}
.pics{position:sticky;top:62px;z-index:3;background:#fff;padding:4px 0 8px;margin:0 -2px 4px}
.pics img{max-height:34vh;object-fit:contain;background:#fff}

const KEY="jenny_hw_people_places_v11";
let st={a:{},done:false,page:0};
try{const s=localStorage.getItem(KEY);if(s)st=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const ans=(t,i)=>st.a[t+'_'+i], ok=(t,i)=>T[t].items[i][2], right=(t,i)=>{const c=ok(t,i),a=ans(t,i);return Array.isArray(c)?c.includes(a):a===c};
const answered=t=>T[t].items.every((_,i)=>i==0||ans(t,i)!==undefined);
function render(){
 const s=document.getElementById('screen');
 if(st.done){results();return}
 const p=st.page,t=T[p],tf=t.items[0][1][0]=='True';
 let h=`<div class="q"><span class="n">${p+1}</span><span>${t.t}</span></div>`;
 if(t.note)h+=`<div class="note">${t.note}</div>`;
 if(t.img)h+=`<div class="pics"><img src="${IMG2}" alt="Gran's living room now"></div>`;
 t.items.forEach((it,i)=>{const ex=i==0,a=ex?it[2]:ans(p,i);
  let txt=it[0];if(txt.includes('___'))txt=txt.replace('___',`<span class="gap${a!==undefined?' f':''}">${a!==undefined?it[1][a]:'…'}</span>`);
  h+=`<div class="item${ex?' ex':''}${tf?' tf':''}" id="it${i}"><span class="num">${i}</span>${txt}<div class="opts">`+
   it[1].map((o,k)=>`<button class="o${a===k?' sel':''}" ${ex?'disabled':''} onclick="pick(${p},${i},${k})">${o}</button>`).join('')+`</div></div>`});
 s.innerHTML=h;nav()}
function pick(t,i,k){st.a[t+'_'+i]=k;save();const y=window.scrollY;render();window.scrollTo(0,y)}
function results(){
 let h=`<div class="q"><span class="n">★</span><span>Your results</span></div><table class="res">`,tot=0,max=0;
 T.forEach((t,ti)=>{let sc=0,m=t.items.length-1;for(let i=1;i<=m;i++)if(right(ti,i))sc++;tot+=sc;max+=m;
  h+=`<tr><td>Task ${ti+1}</td><td>${sc} / ${m}</td></tr>`});
 h+=`</table><div class="total"><div>${tot}<small>out of ${max}</small></div></div>`;
 document.getElementById('screen').innerHTML=h;nav()}
function nav(){
 const n=T.length,p=st.page;
 document.getElementById('nav').style.display=st.done?'none':'block';
 document.getElementById('step').textContent=st.done?'Done!':`Task ${p+1} of ${n}`;
 let d=0,all=0;T.forEach((t,ti)=>t.items.forEach((_,i)=>{if(i){all++;if(ans(ti,i)!==undefined)d++}}));
 document.getElementById('prog').style.width=(st.done?100:d/all*100)+'%';
 document.getElementById('back').style.visibility=p==0?'hidden':'visible';
 document.getElementById('next').textContent=p==n-1?'Finish':'Next'}
document.getElementById('back').onclick=()=>{st.page--;save();render();scrollTo(0,0)};
document.getElementById('next').onclick=()=>{
 const p=st.page;
 if(p<T.length-1){st.page++;save();render();scrollTo(0,0);return}
 for(let t=0;t<T.length;t++)if(!answered(t)){
  const i=T[t].items.findIndex((_,i)=>i&&ans(t,i)===undefined);st.page=t;save();render();
  const el=document.getElementById('it'+i);el.classList.add('miss');el.scrollIntoView({behavior:'smooth',block:'center'});return}
 st.done=true;save();render();scrollTo(0,0)};
render();
</script></body></html>
