<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0c4a4a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Beckham Family</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16302f;--muted:#6b8584;--acc:#0e7c7b;--acc2:#17a2a0;--deep:#0a4f4f;--soft:#eef8f7;--soft2:#dff1ef;--line:#e2efed;--field:#cfe3e1;--ok:#2e8b4e;--okbg:#eaf7ee;--bad:#c6413a;--badbg:#fdf1f0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);min-height:100vh;padding:22px 16px 40px;background:#062b2c}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 10% -10%,#1c8f8b55,transparent 60%),radial-gradient(700px 500px at 110% 20%,#3cc2b833,transparent 60%),radial-gradient(800px 600px at 50% 120%,#0b6b6a66,transparent 60%),linear-gradient(165deg,#0c4a4a,#062b2c 70%)}
.wrap{max-width:680px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;color:#d6f1ee;margin-bottom:14px;font-size:14px;letter-spacing:.02em}
.tl{display:flex;align-items:center;gap:8px}
#lbl{min-width:58px;text-align:center;font-weight:500}
.back{width:38px;height:38px;border-radius:50%;border:1px solid #ffffff26;background:#ffffff14;color:#e4f7f5;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.back:hover{background:#ffffff2e}.back.off{visibility:hidden}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#ffffff2e;transition:all .3s}.dots i.on{background:#9fe6df;width:16px;border-radius:4px}
.card{position:relative;background:#fff;border-radius:22px;padding:28px 22px 24px;box-shadow:0 24px 60px #00000055,0 2px 0 #ffffff inset;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--deep),var(--acc2),#7fd8cf)}
h1{margin:0;font-size:30px;line-height:1.2;color:var(--deep);font-weight:600}
.kick{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);font-weight:600;margin-bottom:6px}
h2{margin:0 0 16px;font-size:21px;line-height:1.3;color:var(--deep);font-weight:600}
p.txt{line-height:1.8;font-size:17px;margin:0 0 14px}
.ex{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:15px;color:var(--muted);line-height:1.6;border:1px dashed #b9dcd8}
.ex b{color:var(--acc)}
.row{padding:13px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:2}
.row:has(+ .fb){border-bottom:0}
.n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--soft2);color:var(--acc);font-size:13px;font-weight:600;margin-right:8px;vertical-align:1px}
select,input{font:inherit;font-size:16px;border:1.5px solid var(--field);border-radius:10px;padding:6px 10px;color:var(--ink);background:#fff;transition:border-color .2s,box-shadow .2s}
select{cursor:pointer}
input{width:100%;margin-top:8px}
input.short{width:160px;margin:0}
select:focus,input:focus{outline:none;border-color:var(--acc2);box-shadow:0 0 0 3px #17a2a022}
.ok{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)}
.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.tf{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tf button{flex:1;min-width:130px;padding:10px;border:1.5px solid var(--field);background:#fff;border-radius:10px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);transition:all .2s}
.tf button:hover{border-color:var(--acc2)}
.tf button.sel{border-color:var(--acc);background:var(--soft);color:var(--acc);font-weight:600}
.ans{display:block;font-size:14px;color:var(--ok);margin-top:4px;font-weight:500}
.ans:before{content:"→ "}.ans.hint{color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.06em}.ans.hint:before{content:"💡 "}.ans.fix{color:var(--muted);font-weight:400}.ans.fix:before{content:"✓ "}
.btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.b{border:0;border-radius:12px;padding:14px 26px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s}
.b:active{transform:scale(.97)}
.b.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 20px #0e7c7b40;flex:1}
.b.s{background:var(--soft2);color:var(--deep)}
.fb{margin-top:16px;font-weight:600;color:var(--acc);font-size:18px}
.dlg{padding:14px 0}
.dlg div{margin:8px 0;line-height:1.9}.dlg select{min-width:150px}
.who{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--soft2);color:var(--acc);font-size:13px;font-weight:600;margin-right:8px}
.score{width:150px;height:150px;border-radius:50%;margin:16px auto 22px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:600;color:var(--deep);background:radial-gradient(circle,#fff 58%,transparent 59%),conic-gradient(var(--acc2) var(--p,0%),var(--soft2) 0)}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:9px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;color:var(--acc);font-weight:600;white-space:nowrap;padding-left:10px}
.hide{display:none!important}
.bub{display:flex;align-items:flex-end;gap:12px;font-weight:400;color:var(--ink);animation:pop .3s ease}
.av{flex-shrink:0;width:58px;height:58px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 0 0 2px var(--acc2),0 4px 12px #0e7c7b33}
.bt{background:var(--soft);border:1.5px solid #c9e7e3;border-radius:18px 18px 18px 4px;padding:11px 15px;font-size:15px;line-height:1.5}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hd{margin-bottom:6px}.hd h2{margin:0 0 14px}
.tb{display:block;width:100%;border:1.5px solid #bfe2de;background:var(--soft);color:var(--deep);border-radius:14px;padding:13px;font:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:background .2s}
.tb:hover{background:var(--soft2)}
.ph{margin:18px 0 22px}.pw{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px #0a4f4f33}
.pw:after{content:"";position:absolute;inset:55% 0 0 0;background:linear-gradient(transparent,#06302f99);pointer-events:none}
.ph img{width:100%;display:block}
.tag{position:absolute;z-index:1;bottom:8%;transform:translateX(-50%);background:#ffffffee;color:var(--deep);font-size:12px;font-weight:600;padding:4px 9px;border-radius:20px;box-shadow:0 3px 10px #0004;white-space:nowrap}
@media(max-width:480px){.tag{font-size:10px;padding:2px 6px}}
.days{color:var(--deep);font-weight:600;margin-bottom:10px;line-height:1.8}
u{text-decoration:none;border-bottom:2px solid var(--acc2)}
.gl{font-size:.78em;background:var(--soft2);color:var(--deep);border-radius:6px;padding:1px 6px;margin:0 2px;font-style:italic}
#textBox{margin:12px 0 18px;background:linear-gradient(var(--soft),#f7fbfb);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
#textBox.clip{max-height:96px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent);cursor:pointer}
#textBox p.txt{font-size:15px;line-height:1.65}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="tl"><button class="back" id="back" onclick="go(-1)" aria-label="Back"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><span id="lbl">Reading</span><button class="back" id="fwd" onclick="go(1)" aria-label="Forward"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button></div><div class="dots" id="dots"></div></div>
  <div class="card" id="card"></div>
</div>
<script>
const TEXT=`<p class="txt">This is the Beckham family. They are from England. David Beckham is a famous footballer. He is about 50. His wife is Victoria. She is about 50 too. Victoria is a designer.</p>
<p class="txt">David and Victoria are husband and wife. They are parents. Their children are Brooklyn, Romeo, Cruz and Harper. Brooklyn, Romeo and Cruz are boys. Harper is a girl. She is about 15.</p>
<p class="txt">Brooklyn is about 27. His wife is Nicola. Their home is in the USA. Romeo and Cruz are in London. Romeo is about 24, and Cruz is about 21.</p>
<p class="txt">The family's house is in London. It isn't a small flat. It's a very big house! The children's <u>rooms</u> <span class="gl">комнаты</span> are big too.</p>
<p class="txt">It's Sunday. Victoria is at home. David isn't at work. Harper isn't at school. Breakfast is at 9 o'clock. David's coffee is with milk. Victoria's tea is with lemon. Harper's drink is fresh orange juice. Lunch is at 2 o'clock, and dinner is at 7. Sunday dinner is a family dinner!</p>
<p class="txt">Is Victoria's breakfast big? No, it isn't. It's small: an apple and green tea with mint.</p>`;

const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/["“”]/g,"").replace(/[?.!,;:]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
// 0 = wrong, 1 = exact, 2 = small typo (counts as right)
function judge(v,list){const n=norm(v);if(!n)return 0;if([].concat(list).every(x=>/'s\b/.test(norm(x))&&!/'s\b/.test(n)))return 0;let best=99;for(const x of alts(list)){if(x===n)return 1;best=Math.min(best,lev(x,n))}return best<=(n.length>12?2:1)&&n.length>=5?2:0}
function hint(ans){return ans.replace(/[A-Za-z]+/g,w=>w[0]+"_".repeat(w.length-1).split("").join(" ").replace(/ /g," "))}

  [["A","Coffee or tea?"],["B","Tea with milk, please. __","And you?"],["A","Coffee with sugar. Look! It's David Beckham!"],["B","__ Where?","Really?"],["A","Oh, __ It isn't David.","Sorry!"]],
  [["A","How old is your sister?"],["B","__ About 30?","I don't know."],["A","Is she a mum?"],["B","Yes, she is. Her baby is a girl!"],["A","__","Nice!"]]]}
];

function mark(el,ok,note,cls){el.classList.remove('ok','bad');el.classList.add(ok?'ok':'bad');
